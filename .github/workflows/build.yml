name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore CodexUsageWidget.sln
      - name: Test
        run: dotnet test CodexUsageWidget.sln -c Release --no-restore
      - name: Publish
        run: dotnet publish src/CodexUsageWidget/CodexUsageWidget.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish
      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: CodexUsageWidget-win-x64
          path: artifacts/publish/CodexUsageWidget.exe
      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $package = "artifacts/CodexUsageWidget-v$version-win-x64.zip"
          Compress-Archive -Path artifacts/publish/CodexUsageWidget.exe,README.md,LICENSE,PRIVACY.md -DestinationPath $package -Force
          $assets = @('artifacts/publish/CodexUsageWidget.exe', $package)
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))"
          }
          $lines | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            artifacts/publish/CodexUsageWidget.exe `
            artifacts/CodexUsageWidget-${{ github.ref_name }}-win-x64.zip `
            artifacts/SHA256SUMS.txt `
            --generate-notes --latest --verify-tag
